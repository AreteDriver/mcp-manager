name: "MCP Manager Validate"
description: "Validate .mcp-manager.yml project config and optionally run deep health checks"
author: "AreteDriver"
branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: "Path to .mcp-manager.yml or its directory"
    required: false
    default: "."
  strict:
    description: "Run deep health checks on discovered servers (requires deps on runner)"
    required: false
    default: "false"
  lockfile-check:
    description: "Run mcp-manager lock --check to validate version pinning"
    required: false
    default: "false"
  version:
    description: "Version of arete-mcp to install (e.g. 0.2.0 or latest). Set to 'local' to install from a checked-out repo."
    required: false
    default: "latest"
  package-path:
    description: "Path to the arete-mcp source directory (used when version=local)"
    required: false
    default: ""
  uv-version:
    description: "Pinned uv version used to provide uvx for Python MCP servers"
    required: false
    default: "0.11.7"

runs:
  using: "composite"
  steps:
    - name: Setup Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
      with:
        python-version: "3.12"

    - name: Install arete-mcp
      shell: bash
      env:
        MCP_MANAGER_ACTION_VERSION: ${{ inputs.version }}
        MCP_MANAGER_PACKAGE_PATH: ${{ inputs.package-path }}
      run: |
        if [ "$MCP_MANAGER_ACTION_VERSION" = "local" ] && [ -n "$MCP_MANAGER_PACKAGE_PATH" ]; then
          pip install -e "$MCP_MANAGER_PACKAGE_PATH"
        elif [ "$MCP_MANAGER_ACTION_VERSION" = "latest" ]; then
          pip install arete-mcp
        else
          pip install "arete-mcp==$MCP_MANAGER_ACTION_VERSION"
        fi

    - name: Install uv runtime
      shell: bash
      env:
        MCP_MANAGER_UV_VERSION: ${{ inputs.uv-version }}
      run: python -m pip install "uv==$MCP_MANAGER_UV_VERSION"

    - name: Validate .mcp-manager.yml
      shell: bash
      env:
        MCP_MANAGER_PATH: ${{ inputs.path }}
        MCP_MANAGER_STRICT: ${{ inputs.strict }}
      run: |
        args=(--path "$MCP_MANAGER_PATH")
        [[ "$MCP_MANAGER_STRICT" == "true" ]] && args+=(--strict)
        mcp-manager validate "${args[@]}"

    - name: Check lockfile
      if: inputs.lockfile-check == 'true'
      shell: bash
      env:
        MCP_MANAGER_PATH: ${{ inputs.path }}
      run: mcp-manager lock --check --path "$MCP_MANAGER_PATH"
