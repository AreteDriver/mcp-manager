name: Marketplace Refresh

on:
  schedule:
    - cron: '0 6 * * *'  # 6 AM UTC daily
  workflow_dispatch:
    inputs:
      write_changes:
        description: Commit refreshed scores (manual runs default to dry-run)
        required: false
        default: false
        type: boolean

concurrency:
  group: marketplace-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"
        continue-on-error: true

      - name: Install Node.js (for npx-based MCP servers)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: '20'

      - name: Refresh marketplace scores
        env:
          WRITE_CHANGES: ${{ github.event_name == 'schedule' || inputs.write_changes }}
        run: |
          args=(marketplace-refresh --output marketplace/index.yaml --timeout 30)
          if [[ "$WRITE_CHANGES" != "true" ]]; then
            args+=(--dry-run)
          fi
          timeout --signal=TERM --kill-after=30s 10m mcp-manager "${args[@]}"

      - name: Commit updated scores
        if: github.event_name == 'schedule' || inputs.write_changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add marketplace/index.yaml
          if git diff --cached --quiet; then
            echo "No score changes to commit."
          else
            git commit -m "chore: refresh marketplace quality scores ($(date -u +%Y-%m-%d))"
            git push
          fi
