name: MCP Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/mcp-manager-validate
        with:
          path: "."
          strict: "false"
          version: "local"
          package-path: "."
          lockfile-check: "true"
