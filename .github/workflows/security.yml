name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: '3.11'

      - name: Install security tools
        run: pip install pip-audit bandit[toml]

      - name: Run pip-audit (CVE scan)
        run: |
          if [ -f uv.lock ]; then
            pip install uv
            uv export --format requirements-txt --no-hashes | pip-audit --desc -r /dev/stdin
          elif [ -f pyproject.toml ]; then
            pip-audit --desc
          elif [ -f requirements.txt ]; then
            pip-audit --desc -r requirements.txt
          else
            echo "No lock file found — running directory scan"
            pip-audit --desc
          fi

      - name: Run Bandit (security lint)
        run: |
          bandit -r . -f json -o bandit-report.json \
            -ll \
            --exclude './.git,./venv,./.venv,./node_modules,./tests' \
            || true

      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
