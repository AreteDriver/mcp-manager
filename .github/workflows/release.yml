name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q --no-header --tb=short

      - name: Version guard
        id: version_guard
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CODE_VERSION=$(python -c "from mcp_manager import __version__; print(__version__)")
          echo "Tag version:    $TAG_VERSION"
          echo "Code version:   $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version mismatch: tag says $TAG_VERSION but __version__ says $CODE_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          pip install build
          python -m build

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${{ steps.version_guard.outputs.version }}"
          if python scripts/extract_changelog.py --version "$VERSION" > "$RUNNER_TEMP/changelog_body.md"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo ''
              echo '---'
              echo '_Auto-generated release notes below:_'
            } >> "$RUNNER_TEMP/changelog_body.md"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo '_Auto-generated release notes below:_' > "$RUNNER_TEMP/changelog_body.md"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          body_path: ${{ runner.temp }}/changelog_body.md
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
