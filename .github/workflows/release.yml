name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,docs]" build twine pip-audit bandit[toml]

      - name: Verify release commit is on main
        run: |
          git fetch origin main --depth=1
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Run quality gates
        run: |
          ruff check src tests
          ruff format --check src tests
          mypy src/mcp_manager
          pytest -q --no-header --tb=short --cov=mcp_manager --cov-fail-under=87
          mkdocs build --strict

      - name: Run security gates
        run: |
          pip-audit --strict --desc=on .
          bandit -r src -ll

      - name: Version guard
        id: version_guard
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          CODE_VERSION=$(python -c "from mcp_manager import __version__; print(__version__)")
          echo "Tag version:    $TAG_VERSION"
          echo "Code version:   $CODE_VERSION"
          if [ "$TAG_VERSION" != "$CODE_VERSION" ]; then
            echo "::error::Version mismatch: tag says $TAG_VERSION but __version__ says $CODE_VERSION"
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          python -m build
          twine check dist/*

      - name: Verify source archive contract
        run: |
          tar -tzf dist/*.tar.gz | grep -F '/action.yml'
          tar -tzf dist/*.tar.gz | grep -F '/docs/production-readiness.md'
          tar -tzf dist/*.tar.gz | grep -F '/docs/security-model.md'

      - name: Smoke-test built wheel
        run: python scripts/rc_dogfood.py --wheel "$(find dist -name '*.whl' -print -quit)"

      - name: Generate release integrity artifacts
        run: |
          pip-audit --strict --format cyclonedx-json --output dist/arete-mcp-sbom.json .
          sha256sum dist/*.whl dist/*.tar.gz dist/arete-mcp-sbom.json > dist/SHA256SUMS

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          VERSION="${{ steps.version_guard.outputs.version }}"
          if python scripts/extract_changelog.py --version "$VERSION" > "$RUNNER_TEMP/changelog_body.md"; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            {
              echo ''
              echo '---'
              echo '_Auto-generated release notes below:_'
            } >> "$RUNNER_TEMP/changelog_body.md"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo '_Auto-generated release notes below:_' > "$RUNNER_TEMP/changelog_body.md"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          generate_release_notes: true
          body_path: ${{ runner.temp }}/changelog_body.md
          files: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
