# Python-focused MCP project template
project: my-project

servers:
  filesystem:
    command: npx
    # Version 2.0.1 includes filesystem security fixes and requires Node.js 24+.
    args: ["-y", "@modelcontextprotocol/server-filesystem@2.0.1"]
    env: {}
    tags: [core, filesystem]

  git:
    command: uvx
    args: ["mcp-server-git", "--repository", "."]
    env: {}
    tags: [core, vcs]
