[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arete-mcp"
version = "0.9.0"
description = "Discover, diagnose, health-check, and sync MCP servers across Codex, Claude Code, Cursor, Windsurf, and more."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "AreteDriver"}]
keywords = ["mcp", "model-context-protocol", "codex", "claude-code", "cursor", "windsurf", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "mcp>=2.1,<3.0",
    "tomlkit>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "pytest-benchmark>=4.0",
    "pytest-cov>=5.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "ruff==0.16.3",
    "build>=1.0",
    "respx>=0.22",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "pymdown-extensions>=10.0",
]

[project.scripts]
mcp-manager = "mcp_manager.cli:app"

[project.urls]
Homepage = "https://github.com/AreteDriver/mcp-manager"
Repository = "https://github.com/AreteDriver/mcp-manager"
Issues = "https://github.com/AreteDriver/mcp-manager/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"mcp_manager.audit.data" = ["*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_manager/cli.py" = ["B008"]  # typer.Option/Argument in defaults is required by Typer
"src/mcp_manager/commands/project.py" = ["B008"]
"src/mcp_manager/commands/registry_cmd.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.mypy]
python_version = "3.11"
strict = true
