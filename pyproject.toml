[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "arete-mcp"
version = "0.4.0"
description = "Discover, health-check, and sync MCP servers across Claude Code, Cursor, Windsurf, and more. Git-native project configs with atomic IDE write-back."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{name = "AreteDriver"}]
keywords = ["mcp", "model-context-protocol", "claude-code", "cursor", "windsurf", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.9.0",
    "rich>=13.0",
    "pydantic>=2.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.0",
    "types-PyYAML>=6.0",
    "ruff>=0.1.0",
]

[project.scripts]
mcp-manager = "mcp_manager.cli:app"

[project.urls]
Homepage = "https://github.com/AreteDriver/mcp-manager"
Repository = "https://github.com/AreteDriver/mcp-manager"
Issues = "https://github.com/AreteDriver/mcp-manager/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/mcp_manager/cli.py" = ["B008"]  # typer.Option/Argument in defaults is required by Typer

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
