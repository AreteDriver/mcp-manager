site_name: mcp-manager
site_description: "Discover, health-check, and sync MCP servers across Claude Code, Cursor, Windsurf, and more."
site_url: https://aretedriver.github.io/mcp-manager/
repo_url: https://github.com/AreteDriver/mcp-manager
copyright: "Copyright &copy; 2026 AreteDriver"

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - Team Features: team.md
  - IDE Support: ide-support.md
  - Contributing: contributing.md
  - Changelog: changelog.md
