name: MCP Manager Validate
description: Validate shared MCP configs, dependencies, health, and lockfiles in CI
author: AreteDriver

branding:
  icon: check-circle
  color: green

inputs:
  path:
    description: Path to .mcp-manager.yml or its directory
    required: false
    default: "."
  strict:
    description: Run deep MCP server health checks
    required: false
    default: "false"
  lockfile-check:
    description: Verify that .mcp-manager.lock is current
    required: false
    default: "false"
  python-version:
    description: Python version used to run mcp-manager
    required: false
    default: "3.12"
  uv-version:
    description: Pinned uv version used for Python MCP server commands
    required: false
    default: "0.11.7"

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mcp-manager from this release
      shell: bash
      run: python -m pip install --disable-pip-version-check "$GITHUB_ACTION_PATH"

    - name: Install uv runtime
      shell: bash
      env:
        MCP_MANAGER_UV_VERSION: ${{ inputs.uv-version }}
      run: python -m pip install --disable-pip-version-check "uv==$MCP_MANAGER_UV_VERSION"

    - name: Validate MCP configuration
      shell: bash
      env:
        MCP_MANAGER_PATH: ${{ inputs.path }}
        MCP_MANAGER_STRICT: ${{ inputs.strict }}
      run: |
        args=(--path "$MCP_MANAGER_PATH")
        [[ "$MCP_MANAGER_STRICT" == "true" ]] && args+=(--strict)
        mcp-manager validate "${args[@]}"

    - name: Verify MCP lockfile
      if: inputs.lockfile-check == 'true'
      shell: bash
      env:
        MCP_MANAGER_PATH: ${{ inputs.path }}
      run: mcp-manager lock --check --path "$MCP_MANAGER_PATH"
